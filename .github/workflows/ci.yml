name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: webchat-ai-ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  typescript:
    name: TypeScript, Server, Extension, Web and Desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webchat-ai-companion-${{ github.sha }}
          path: dist/extension/chrome-mv3
          if-no-files-found: error
          retention-days: 14
  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [typescript]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webchat-ai-companion-${{ github.sha }}
          path: extension-dist
      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd extension-dist
          zip -qr "../webchat-ai-companion-${GITHUB_REF_NAME}.zip" .
          cd ..
          gh release create "$GITHUB_REF_NAME" "webchat-ai-companion-${GITHUB_REF_NAME}.zip" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "WebChat AI ${GITHUB_REF_NAME}"

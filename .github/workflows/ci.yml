name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: webchat-ai-ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  typescript:
    name: TypeScript, Server, Extensions, Web and Desktop
    runs-on: ubuntu-24.04
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/tmp/electron-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check release version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package.json version v$version"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package desktop and server extensions
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          (cd dist/extension/chrome-mv3 && zip -qr "$GITHUB_WORKSPACE/release-assets/webchat-extension-v${version}.zip" .)
          (cd dist/extension-server/chrome-mv3 && zip -qr "$GITHUB_WORKSPACE/release-assets/webchat-server-extension-v${version}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webchat-ai-extensions-${{ github.sha }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14
  windows-installer:
    name: Windows NSIS installer and updater
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [typescript]
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/tmp/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/tmp/release-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Build Windows installer without publishing
        shell: pwsh
        run: .\node_modules\.bin\electron-builder.cmd --win nsis --publish never
      - name: Verify installer and updater artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'Windows installer was not generated' }
          foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath ($installer.FullName + '.blockmap'))) {
              throw "Updater blockmap is missing for $($installer.Name)"
            }
          }
          if (-not (Test-Path -LiteralPath 'release/latest.yml')) { throw 'Updater latest.yml was not generated' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webchat-ai-windows-installer-${{ github.sha }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [typescript, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webchat-ai-extensions-${{ github.sha }}
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webchat-ai-windows-installer-${{ github.sha }}
          path: release-assets
      - name: Publish installer, updater and both extensions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release-assets && sha256sum *.exe *.blockmap latest.yml *.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "WebChat AI ${GITHUB_REF_NAME}"
